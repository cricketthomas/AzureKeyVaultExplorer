name: Release Azure Key Vault Explorer


on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_release:
        type: boolean
        description: Run Release true or false
     
  pull_request:
    types: [opened]
    branches:
      - master

permissions:
  contents: write

env:
  STEP_TIMEOUT_MINUTES: 60
  CONFIGURATION: Release
  dotnetVersion: 10.0.x
  APP_VERSION_NUMBER: 2.1.${{ github.run_number }}

jobs:
  build_windows_x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnetVersion }}
      - uses: actions/cache@v3
        with:
            path: ~/.nuget/win-packages
            key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
            restore-keys: |
              win-nuget
      - name: Publish Windows x64
        shell: pwsh
        run: |
          cd ./src/uno/AzureKeyVaultStudio
          dotnet publish -f net10.0-windows10.0.26100 -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:Version=${{ env.APP_VERSION_NUMBER }} -c Release  -p:WindowsPackageType=None ./AzureKeyVaultStudio.csproj
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/win-x64" -Force
          Move-Item -Path ".\bin\Release\net10.0-windows10.0.26100\win-x64\publish\*.exe" -Destination "$env:GITHUB_WORKSPACE\win-x64\" -Force
      - name: Create Package
        shell: pwsh
        run: Compress-Archive -Path "win-x64/*" -DestinationPath "azurekeyvaultstudio.win-x64.zip" -Force
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurekeyvaultstudio.win-x64.zip
          path: azurekeyvaultstudio.win-x64.zip

  build_windows_arm64:
    name: Build Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnetVersion }}
      - uses: actions/cache@v3
        with:
            path: ~/.nuget/win-arm-packages
            key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
            restore-keys: |
              winarm-nuget
      - name: Publish Windows ARM64
        shell: pwsh
        run: |
          cd ./src/uno/AzureKeyVaultStudio
          dotnet publish -f net10.0-windows10.0.26100 -r win-arm64 -p:Platform=arm64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=false -p:Version=${{ env.APP_VERSION_NUMBER }} -c Release  -p:WindowsPackageType=None ./AzureKeyVaultStudio.csproj
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/win-arm64" -Force
          Move-Item -Path ".\bin\Release\net10.0-windows10.0.26100\win-arm64\publish\*.exe" -Destination "$env:GITHUB_WORKSPACE\win-arm64\" -Force
      - name: Create Package
        shell: pwsh
        run: Compress-Archive -Path "win-arm64/*" -DestinationPath "azurekeyvaultstudio.win-arm64.zip" -Force
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurekeyvaultstudio.win-arm64.zip
          path: azurekeyvaultstudio.win-arm64.zip

  build_macos_x64:
    name: Build macOS x64 (untested)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnetVersion }}
      - uses: actions/cache@v3
        with:
            path: ~/.nuget/macos-x64-packages
            key: ${{ runner.os }}-x64nuget-${{ hashFiles('**/*.csproj') }}
            restore-keys: |
              mac-x64-nuget
      - name: Publish macOS x64
        shell: pwsh
        run: |
          dotnet workload restore
          cd ./src/uno/AzureKeyVaultStudio
          dotnet publish -f net10.0-desktop -p:UnoMacOSCustomInfoPlist=Info.plist -p:PackageFormat=app -p:SelfContained=true -p:PublishReadyToRun=true -r osx-x64 -p:Version=${{ env.APP_VERSION_NUMBER }} -c Release  ./AzureKeyVaultStudio.csproj
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/osx-x64" -Force
          Move-Item -Path "./bin/Release/net10.0-desktop/osx-x64/publish/*.app" -Destination "$env:GITHUB_WORKSPACE/osx-x64/" -Force
      - name: Create Package
        shell: pwsh
        run: |
          $appBundle = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/osx-x64" -Filter "*.app" | Select-Object -First 1
          if (-not $appBundle) { Get-ChildItem -recurse; throw "No macOS app bundle was found for packaging." }
          ditto -c -k --sequesterRsrc --keepParent "$($appBundle.FullName)" "$env:GITHUB_WORKSPACE/azurekeyvaultstudio.macos-x64.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurekeyvaultstudio.macos-x64.zip
          path: azurekeyvaultstudio.macos-x64.zip
  
  build_macos_arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnetVersion }}
      - uses: actions/cache@v3
        with:
            path: ~/.nuget/macos-arm64-packages
            key: ${{ runner.os }}-arm64nuget-${{ hashFiles('**/*.csproj') }}
            restore-keys: |
              mac-arm64-nuget
      - name: Publish macOS ARM64
        shell: pwsh
        run: |
          cd ./src/uno/AzureKeyVaultStudio
          dotnet workload restore
          dotnet publish -f net10.0-desktop -p:UnoMacOSCustomInfoPlist=Info.plist -p:PackageFormat=app -p:PublishReadyToRun=true -r osx-arm64 -p:Version=${{ env.APP_VERSION_NUMBER }} -c Release ./AzureKeyVaultStudio.csproj
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/osx-arm64" -Force
          Move-Item -Path "./bin/Release/net10.0-desktop/osx-arm64/publish/*.app" -Destination "$env:GITHUB_WORKSPACE/osx-arm64/" -Force
      - name: Create Package
        shell: pwsh
        run: |
          $appBundle = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/osx-arm64" -Filter "*.app" | Select-Object -First 1
          if (-not $appBundle) { Get-ChildItem -recurse; throw "No macOS app bundle was found for packaging." }
          ditto -c -k --sequesterRsrc --keepParent "$($appBundle.FullName)" "$env:GITHUB_WORKSPACE/azurekeyvaultstudio.macos-arm64.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurekeyvaultstudio.macos-arm64.zip
          path: azurekeyvaultstudio.macos-arm64.zip

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnetVersion }}
      - uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            linux-nuget
      - name: Publish Linux x64
        shell: pwsh
        run: |
          cd ./src/uno/AzureKeyVaultStudio
          dotnet publish -f net10.0-desktop -r linux-x64 -p:SelfContained=true -p:PublishReadyToRun=true -p:Version=${{ env.APP_VERSION_NUMBER }} -c Release  ./AzureKeyVaultStudio.csproj
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/linux-x64" -Force
          Move-Item -Path ".\bin\Release\net10.0-desktop\linux-x64\publish\*" -Destination "$env:GITHUB_WORKSPACE\linux-x64\" -Force
      - name: Create Package
        shell: pwsh
        run: tar -cvf azurekeyvaultstudio.linux-x64.tar linux-x64
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurekeyvaultstudio.linux-x64.tar
          path: azurekeyvaultstudio.linux-x64.tar


  release:
    name: Release Packages
    needs: [build_windows_x64, build_windows_arm64, build_macos_x64, build_macos_arm64, build_linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event.inputs.run_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: azurekeyvaultstudio.*
      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse
      - name: Generate checksums for Cask
        shell: bash
        run: |
          sha256sum \
            "./azurekeyvaultstudio.win-x64.zip/azurekeyvaultstudio.win-x64.zip" \
            "./azurekeyvaultstudio.win-arm64.zip/azurekeyvaultstudio.win-arm64.zip" \
            "./azurekeyvaultstudio.macos-x64.zip/azurekeyvaultstudio.macos-x64.zip" \
            "./azurekeyvaultstudio.macos-arm64.zip/azurekeyvaultstudio.macos-arm64.zip" \
            "./azurekeyvaultstudio.linux-x64.tar/azurekeyvaultstudio.linux-x64.tar" > SHA256SUMS.txt
      - name: Create Release
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          Notes:
          - macOS x64 build is untested

          ### SHA256 Hashes of the release artifacts:
          ```text
          EOF
          cat ./SHA256SUMS.txt >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          gh release create v${{ env.APP_VERSION_NUMBER }} --draft --title "Azure Key Vault Explorer v${{ env.APP_VERSION_NUMBER }}" --notes-file RELEASE_NOTES.md || true
          gh release upload v${{ env.APP_VERSION_NUMBER }} \
            "./azurekeyvaultstudio.win-x64.zip/azurekeyvaultstudio.win-x64.zip" \
            "./azurekeyvaultstudio.win-arm64.zip/azurekeyvaultstudio.win-arm64.zip" \
            "./azurekeyvaultstudio.macos-x64.zip/azurekeyvaultstudio.macos-x64.zip" \
            "./azurekeyvaultstudio.macos-arm64.zip/azurekeyvaultstudio.macos-arm64.zip" \
            "./azurekeyvaultstudio.linux-x64.tar/azurekeyvaultstudio.linux-x64.tar" \
            "./SHA256SUMS.txt" \
            --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

        #  xattr -c './KeyVault Explorer.app/'
